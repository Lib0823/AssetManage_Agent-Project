rules:
  - entity: StockFilter
    text: "score = |외국인 순매수|*0.3 + |기관 순매수|*0.3 + 거래량 배율*0.3 + 가격 변동성*0.1 — StandardScaler는 매일 당일 100종목 기준으로 새로 fit"
    confidence: EXTRACTED
    manual: false
  - entity: StockFilterScore
    text: "보유 종목은 매도 분석을 보장하기 위해 최종 Top 30에 무조건 강제 포함된다"
    confidence: EXTRACTED
    manual: false
  - entity: SafetyFilter
    text: "매수 승인은 11개 규칙(수급 방향, 감성 임계값, PER/ROE/영업이익률, 추세, 종가 위치 등)을 모두 통과해야 한다"
    confidence: EXTRACTED
    manual: false
  - entity: TradeExecutor
    text: "user_trade_config.is_active가 false면 매매를 실행하지 않고 status:'skipped'로 종료한다"
    confidence: EXTRACTED
    manual: false
  - entity: UserKisAccount
    text: "app_key/app_secret은 Jasypt(PBEWITHHMACSHA512ANDAES_256)로 암호화되어 저장된다"
    confidence: EXTRACTED
    manual: false
  - entity: User
    text: "로그인은 KIS 계정 연동이 필수 전제조건이며, 자격증명이 맞아도 KIS 계정이 없으면 로그인할 수 없다"
    confidence: EXTRACTED
    manual: false
  - entity: AiTradeDecision
    text: "Gemini 응답은 buy_top3/sell_top3 각각 정확히 3개 종목을 포함해야 하며 구조·중복·매수매도 겹침을 검증한다"
    confidence: EXTRACTED
    manual: false
  - entity: TradeExecutionPlan
    text: "스키마 변경의 단일 소스는 Liquibase changelog이며, database/schema.sql은 자동 생성된 스냅샷으로 직접 편집이 금지된다"
    confidence: EXTRACTED
    manual: false
  - entity: SentimentAnalyzer
    text: "시장 전반 트랙(RSS)은 전체 기사 단순 평균, 종목별 트랙(네이버 금융)은 최신 5건을 시간 가중 평균(5,4,3,2,1)으로 집계한다"
    confidence: EXTRACTED
    manual: false
  - entity: TimeSeriesAnalyzer
    text: "Prophet은 종목별 독립 학습이며 매일 새로 fit하고 모델을 저장하지 않는다(DB 저장 없이 KIS 직접 조회)"
    confidence: EXTRACTED
    manual: false
