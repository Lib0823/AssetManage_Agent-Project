    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; color: var(--ink); background: var(--bg); }
    #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; }
    header { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 15px; margin: 0; font-weight: 650; }
    header .meta { color: var(--muted); font-size: 12px; }
    header .spacer { flex: 1; }
    input, button { font: inherit; }
    #search { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink); width: 200px; }
    .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    .btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; }
    .btn:hover { border-color: var(--accent); }
    #cy { width: 100%; height: 100%; }
    #panel { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    #panel h2 { font-size: 15px; margin: 0 0 4px; }
    #panel .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; margin-bottom: 10px; }
    #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
    #panel ul { margin: 0; padding-left: 18px; font-size: 13px; }
    #panel li { margin: 3px 0; word-break: break-all; }
    #panel .empty { color: var(--muted); font-size: 13px; }
    .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); align-items: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    code { background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🕸️ DevKit Ontology</h1>
    <span class="meta" id="meta"></span>
    <span class="legend">
      <span><span class="dot" style="background:var(--c-extracted)"></span>EXTRACTED</span>
      <span><span class="dot" style="background:var(--c-inferred)"></span>INFERRED</span>
      <span><span class="dot" style="background:var(--c-ambiguous)"></span>AMBIGUOUS</span>
    </span>
    <span class="spacer"></span>
    <input id="search" type="search" placeholder="개체 검색 (한/영)" />
    <label class="toggle"><input type="checkbox" class="cf" value="EXTRACTED" checked /> EXTRACTED</label>
    <label class="toggle"><input type="checkbox" class="cf" value="INFERRED" checked /> INFERRED</label>
    <label class="toggle"><input type="checkbox" class="cf" value="AMBIGUOUS" checked /> AMBIGUOUS</label>
    <button class="btn" id="fit">맞춤</button>
    <button class="btn" id="export-yaml">Export YAML</button>
    <button class="btn" id="export-layout">Export Layout</button>
  </header>
  <div id="cy"></div>
  <aside id="panel"><p class="empty">노드를 클릭하면 상세 정보가 표시됩니다.</p></aside>
</div>
<script>
  "use strict";
  const DATA = JSON.parse(document.getElementById("ontology-data").textContent);
  const entities = DATA.entities || [];
  const relations = DATA.relations || [];
  const rules = DATA.rules || [];
  const savedLayout = DATA.layout || {};
  const meta = DATA.meta || {};
  document.getElementById("meta").textContent =
    `scope: ${meta.scope || "?"} · v${meta.version || "?"} · 개체 ${entities.length} · 관계 ${relations.length}`;

  // Cytoscape 는 canvas 렌더라 CSS 변수(var(--...))를 해석하지 못한다 → 구체 hex 사용.
  // prefers-color-scheme 를 JS 로 감지해 라이트/다크 팔레트를 고른다.
  const DARK = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const PAL = DARK
    ? { extracted: "#3b82f6", inferred: "#3a4a6b", ambiguous: "#f59e0b", bg: "#12151c", accent: "#60a5fa", edge: "#9aa3b2", edgeText: "#9aa3b2" }
    : { extracted: "#1d4ed8", inferred: "#93b4f5", ambiguous: "#d97706", bg: "#f7f8fa", accent: "#2563eb", edge: "#9aa3b2", edgeText: "#6b7280" };
  const CONF_COLOR = { EXTRACTED: PAL.extracted, INFERRED: PAL.inferred, AMBIGUOUS: PAL.ambiguous };
  function confColor(c) { return CONF_COLOR[c] || PAL.inferred; }

  // ── Cytoscape elements ──
  const nodeEls = entities.map(e => ({
    data: {
      id: e.name, label: e.name, confidence: e.confidence || "INFERRED",
      stale: !!e.stale, entity: e,
    },
    position: savedLayout[e.name] ? { x: savedLayout[e.name].x, y: savedLayout[e.name].y } : undefined,
  }));
  const names = new Set(entities.map(e => String(e.name)));
  const edgeEls = relations
    .filter(r => names.has(String(r.from)) && names.has(String(r.to)))
    .map((r, i) => ({ data: { id: `e${i}`, source: r.from, target: r.to, label: r.type || "", rel: r } }));

  const hasPositions = entities.some(e => savedLayout[e.name]);
  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [...nodeEls, ...edgeEls],
    style: [
      { selector: "node", style: {
          "background-color": ele => confColor(ele.data("confidence")),
          "label": "data(label)", "color": "#fff", "font-size": 11, "font-weight": 600,
          "text-valign": "center", "text-halign": "center", "text-wrap": "wrap", "text-max-width": 90,
          "width": "label", "height": "label", "padding": "10px", "shape": "round-rectangle",
          "border-width": 0,
      }},
      { selector: "node[?stale]", style: { "border-width": 2, "border-style": "dashed", "border-color": "#ef4444", "opacity": 0.6 } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": PAL.accent } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": PAL.edge, "target-arrow-color": PAL.edge,
          "target-arrow-shape": "triangle", "curve-style": "bezier",
          "label": "data(label)", "font-size": 9, "color": PAL.edgeText,
          "text-background-color": PAL.bg, "text-background-opacity": 1, "text-background-padding": 2,
      }},
      { selector: ".dim", style: { "opacity": 0.12 } },
      { selector: ".hl", style: { "line-color": PAL.accent, "target-arrow-color": PAL.accent, "width": 2.5 } },
    ],
    layout: hasPositions ? { name: "preset" } : { name: "cose", animate: false, padding: 40, nodeRepulsion: 8000 },
    wheelSensitivity: 0.2,
  });

  // ── 사이드 패널 ──
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function showEntity(e) {
    const relRules = rules.filter(r => String(r.entity).toLowerCase() === String(e.name).toLowerCase());
    const outRel = relations.filter(r => r.from === e.name);
    const inRel = relations.filter(r => r.to === e.name);
    const srcRefs = e.source_refs || [];
    let h = `<h2>${esc(e.name)}</h2>`;
    h += `<span class="badge" style="background:${confColor(e.confidence)}">${esc(e.confidence || "INFERRED")}${e.manual ? " · manual" : ""}${e.stale ? " · stale" : ""}</span>`;
    if (e.aliases && e.aliases.length) h += `<h3>별칭</h3><ul>${e.aliases.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
    if (e.attributes && e.attributes.length) h += `<h3>속성</h3><ul>${e.attributes.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
    if (srcRefs.length) h += `<h3>source_refs</h3><ul>${srcRefs.map(s => `<li>${esc(s.type || "")}: <code>${esc(s.path || s.name || "")}</code>${s.line ? ":" + esc(s.line) : ""}</li>`).join("")}</ul>`;
    if (outRel.length || inRel.length) {
      h += `<h3>관계</h3><ul>`;
      h += outRel.map(r => `<li>${esc(e.name)} —${esc(r.type)}→ ${esc(r.to)}</li>`).join("");
      h += inRel.map(r => `<li>${esc(r.from)} —${esc(r.type)}→ ${esc(e.name)}</li>`).join("");
      h += `</ul>`;
    }
    if (relRules.length) h += `<h3>규칙</h3><ul>${relRules.map(r => `<li>${esc(r.text)}</li>`).join("")}</ul>`;
    document.getElementById("panel").innerHTML = h;
  }
  cy.on("tap", "node", evt => {
    const e = evt.target.data("entity");
    showEntity(e);
    cy.elements().addClass("dim");
    const nb = evt.target.closedNeighborhood();
    nb.removeClass("dim");
    nb.edges().addClass("hl");
  });
  cy.on("tap", evt => {
    if (evt.target === cy) {
      cy.elements().removeClass("dim").removeClass("hl");
      document.getElementById("panel").innerHTML = '<p class="empty">노드를 클릭하면 상세 정보가 표시됩니다.</p>';
    }
  });

  // ── 검색 (이름 + 별칭, 한/영) ──
  document.getElementById("search").addEventListener("input", ev => {
    const q = ev.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach(n => {
      const e = n.data("entity");
      const hay = [e.name, ...(e.aliases || [])].join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
  });

  // ── 신뢰도 필터 ──
  function applyConfFilter() {
    const on = new Set([...document.querySelectorAll(".cf:checked")].map(c => c.value));
    cy.nodes().forEach(n => n.style("display", on.has(n.data("confidence")) ? "element" : "none"));
  }
  document.querySelectorAll(".cf").forEach(c => c.addEventListener("change", applyConfFilter));

  document.getElementById("fit").addEventListener("click", () => cy.fit(null, 40));

  // ── Export ──
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  }
  function yamlQuote(s) {
    s = String(s);
    return /[:#\-?\[\]{}&*!|>'"%@`,\n]/.test(s) || s.trim() !== s || s === "" ? JSON.stringify(s) : s;
  }
  function toYaml() {
    // 현재 그래프 상태를 스키마 yaml 로 직렬화 (가벼운 편집 반영)
    const lines = [];
    lines.push(`version: ${meta.version || 1}`);
    lines.push(`scope: ${meta.scope || "backend"}`);
    lines.push("entities:");
    cy.nodes().forEach(n => {
      const e = n.data("entity");
      lines.push(`  - name: ${yamlQuote(e.name)}`);
      if (e.aliases && e.aliases.length) lines.push(`    aliases: [${e.aliases.map(yamlQuote).join(", ")}]`);
      if (e.attributes && e.attributes.length) lines.push(`    attributes: [${e.attributes.map(yamlQuote).join(", ")}]`);
      if (e.source_refs && e.source_refs.length) {
        lines.push("    source_refs:");
        e.source_refs.forEach(s => {
          lines.push(`      - type: ${yamlQuote(s.type || "")}`);
          if (s.path) lines.push(`        path: ${yamlQuote(s.path)}`);
          if (s.name) lines.push(`        name: ${yamlQuote(s.name)}`);
          if (s.line) lines.push(`        line: ${s.line}`);
        });
      }
      lines.push(`    confidence: ${e.confidence || "INFERRED"}`);
      lines.push(`    manual: ${e.manual ? "true" : "false"}`);
    });
    lines.push("relations:");
    cy.edges().forEach(ed => {
      const r = ed.data("rel");
      lines.push(`  - from: ${yamlQuote(r.from)}`);
      lines.push(`    to: ${yamlQuote(r.to)}`);
      lines.push(`    type: ${r.type || "REFERENCES"}`);
      lines.push(`    confidence: ${r.confidence || "INFERRED"}`);
      lines.push(`    manual: ${r.manual ? "true" : "false"}`);
    });
    if (rules.length) {
      lines.push("rules:");
      rules.forEach(r => {
        lines.push(`  - entity: ${yamlQuote(r.entity)}`);
        lines.push(`    text: ${yamlQuote(r.text)}`);
        lines.push(`    confidence: ${r.confidence || "INFERRED"}`);
        lines.push(`    manual: ${r.manual === false ? "false" : "true"}`);
      });
    }
    return lines.join("\n") + "\n";
  }
  document.getElementById("export-yaml").addEventListener("click", () => download("ontology.yaml", toYaml(), "text/yaml"));
  document.getElementById("export-layout").addEventListener("click", () => {
    const layout = {};
    cy.nodes().forEach(n => { const p = n.position(); layout[n.id()] = { x: Math.round(p.x), y: Math.round(p.y) }; });
    download("ontology.layout.json", JSON.stringify(layout, null, 2), "application/json");
  });
</script>
</body>
</html>
