services:
  postgres:
    # TimescaleDB = Postgres 16 + timescaledb extension (drop-in replacement, same PGDATA format).
    # 일부 시계열 테이블(stock_filter_score/prophet_forecast/news_analysis/asset_daily_snapshot)을
    # hypertable로 관리하기 위함. Liquibase가 CREATE EXTENSION 및 create_hypertable()을 적용한다.
    image: timescale/timescaledb:latest-pg16
    container_name: financemanage-postgres
    # timescaledb는 Postgres 배경 워커 훅을 쓰기 때문에 shared_preload_libraries에 등록되어야
    # 서버가 시작할 때부터 로드된다(CREATE EXTENSION만으로는 부족). 기존(postgres:16으로 초기화된)
    # 볼륨을 재사용하는 경우 이미지의 최초-초기화 스크립트가 다시 돌지 않으므로 command로 명시한다.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financemanage}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 스키마는 api-server의 Liquibase가 부팅 시 적용
      # See: api-server/src/main/resources/db/changelog/
    networks:
      - financemanage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-financemanage}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # kafka — 매매 주문 큐 (ai-agent Stage 6 발행 → api-server 소비)
  # KRaft 모드 단일 노드: Zookeeper 불필요(Kafka 4.x 는 아예 지원하지 않음).
  kafka:
    image: apache/kafka:4.0.0
    container_name: financemanage-kafka
    environment:
      # --- KRaft (broker + controller 겸용 단일 노드) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 리스너 ---
      # PLAINTEXT(9092): 컨테이너 네트워크 내부(api-server/ai-agent → kafka:9092)
      # EXTERNAL(29092): 호스트에서 로컬 개발용 접속(localhost:29092)
      # 컨테이너 내부 9092 를 호스트로 그대로 노출하면 advertised 주소가 충돌하므로 분리한다.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- 단일 노드용 복제 설정 (기본값 3 이면 토픽 생성이 실패한다) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 매매 주문은 사후 대조가 필요하므로 기본 7일보다 넉넉히 30일 보관.
      KAFKA_LOG_RETENTION_HOURS: 720
      # 이미지 기본 log.dirs 는 /tmp/kraft-combined-logs 이며 아래 volumes 마운트(/var/lib/kafka/data)와
      # 다르다. 지정하지 않으면 볼륨이 비어있는 채로 마운트만 되고 실제 로그는 컨테이너 writable
      # layer 에 쓰여 `docker compose down` 한 번에 DLQ 를 포함한 전체 토픽 데이터가 소실된다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: financemanage-kafka-cluster
      TZ: Asia/Seoul
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - financemanage-network
    restart: unless-stopped
    healthcheck:
      # 브로커 API 가 실제로 응답하는지 확인 (포트 개방만으로는 부족 — 기동 중에도 열려 있다)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # redis — KIS API 토큰 버킷(rate limit) + 시세/재무 응답 캐시(stale-if-error) 저장소.
  # api-server 인스턴스가 여러 개여도 버킷이 하나로 유지되어야 하므로 프로세스 메모리가 아닌
  # 외부 저장소를 쓴다. 캐시/버킷 모두 유실돼도 재구성 가능한 파생 데이터라 영속 볼륨을 두지 않는다
  # (Postgres/Kafka 와 달리 재기동 시 콜드 스타트가 정상 동작이다).
  redis:
    image: redis:7-alpine
    container_name: financemanage-redis
    # 로컬 개발이므로 인증 없음 (Postgres/Kafka 와 동일 기조 — 컨테이너 네트워크 내부 전용).
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    networks:
      - financemanage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # api-server (Spring Boot) — 인증·매매 실행·조회 API
  api-server:
    build: ./api-server
    container_name: financemanage-api
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-financemanage}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      # .env 의 KAFKA_BOOTSTRAP_SERVERS(로컬용 localhost:29092)를 컨테이너 내부 주소로 덮어쓴다.
      # SPRING_DATASOURCE_URL 과 동일한 패턴.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # .env 의 REDIS_HOST(로컬용 localhost)를 컨테이너 내부 주소로 덮어쓴다.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financemanage-network
    restart: unless-stopped

  # ai-agent (FastAPI) — 수집·3축 분석·Gemini 판단·안전망
  ai-agent:
    build: ./ai-agent
    container_name: financemanage-ai
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-financemanage}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      # KR-FinBERT 모델 캐시 (재시작 간 재다운로드 방지)
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - financemanage-network
    restart: unless-stopped

  # web-app (Vue3 + Nginx) — 대시보드·AI 분석 화면. /api 는 nginx가 api-server로 프록시
  web-app:
    build:
      context: ./web-app
      args:
        VITE_API_BASE_URL: /api
    container_name: financemanage-web
    ports:
      - "3000:80"
    depends_on:
      - api-server
    networks:
      - financemanage-network
    restart: unless-stopped

  # elasticsearch — 확장 예정 (현재 코드 미사용이라 비활성)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: financemanage-es
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - financemanage-network

volumes:
  postgres-data:
  hf-cache:
  kafka-data:

networks:
  financemanage-network:
    driver: bridge
