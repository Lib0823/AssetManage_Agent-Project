plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0-SNAPSHOT'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.inbeom'
version = '0.0.1-SNAPSHOT'
description = 'api-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 실시간 시세 브리지 (KIS WebSocket ⇄ 브라우저). kis.realtime.enabled=true 일 때만 활성.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Kafka — ai-agent Stage 6 매매 주문 큐(trade.order.requested/result/dlq) 소비·발행.
    // 동기 HTTP(/internal/**) 경로의 "실패 시 주문 영구 유실"을 대체한다.
    implementation 'org.springframework.kafka:spring-kafka'

    // Redis — KIS API 토큰 버킷(rate limit) + 시세/재무 응답 캐시(stale-if-error).
    // 인스턴스가 여러 개여도 버킷/캐시가 하나로 공유되어야 하므로 프로세스 메모리를 쓰지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT Authentication
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Jasypt (Encryption)
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

    // WebAuthn / Passkey (Yubico java-webauthn-server).
    // 자체 Jackson2(com.fasterxml) 직렬화를 내장하며, Spring Boot 4.1 의 Jackson3(tools.jackson)와
    // 패키지가 달라 공존한다. 브라우저↔서버 WebAuthn JSON 은 라이브러리 헬퍼
    // (toCredentialsCreateJson / parseRegistrationResponseJson 등)만 사용한다.
    implementation 'com.yubico:webauthn-server-core:2.7.0'
    // Yubico 의 toJson()/parse... 헬퍼가 com.fasterxml.jackson.core.JsonProcessingException 을
    // throws 절에 노출하므로 jackson-core(Jackson2)를 compile 클래스패스에 명시한다.
    // (Spring Boot 4.1 은 Jackson3(tools.jackson)를 쓰므로 자동으로 끌려오지 않음.)
    // 버전은 Yubico 가 끌어오는 transitive 버전과 일치시켜 충돌을 피한다.
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // @SpringBootTest(profile=test) 전용 인메모리 DB. 로컬 PostgreSQL 없이 컨텍스트 기동을
    // 검증하기 위한 것이며, 운영 스키마(Liquibase/PostgreSQL)를 대체하지 않는다.
    testRuntimeOnly 'com.h2database:h2'

    // TimescaleDB hypertable 마이그레이션 무결성 테스트 전용 (Docker 필요, `timescaledbTest`로만 실행).
    // Spring Boot 4.1.0-SNAPSHOT BOM 이 아직 testcontainers 버전을 관리하지 않아 명시 고정한다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'

    // Kafka 매매 주문 컨슈머 통합 테스트 전용 (Docker 필요, `kafkaTest`로만 실행).
    testImplementation 'org.testcontainers:kafka:1.21.4'

    // KIS rate limit / 응답 캐시 통합 테스트 전용 (Docker 필요, `redisTest`로만 실행).
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'timescaledb'
        excludeTags 'kafka'
        excludeTags 'redis'
    }
    finalizedBy jacocoTestReport
}

// TimescaleDB hypertable 전환 무결성 테스트. 실제 Docker 컨테이너(timescale/timescaledb)를 띄우므로
// 기본 `test`에서는 제외하고 별도 태스크로 분리한다 — Docker 없는 환경/일반 빠른 테스트 루프를 방해하지 않기 위함.
tasks.register('timescaledbTest', Test) {
    description = 'Runs TimescaleDB hypertable migration integrity tests (requires Docker).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'timescaledb'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}

// Kafka 매매 주문 파이프라인(멱등성/재시도/DLQ) 통합 테스트. 실제 Kafka + PostgreSQL 컨테이너를
// 띄우므로 기본 `test`에서 제외하고 별도 태스크로 분리한다 — timescaledbTest 와 동일한 이유.
tasks.register('kafkaTest', Test) {
    description = 'Runs Kafka trade-order consumer integration tests (requires Docker).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'kafka'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}

// KIS rate limit(토큰 버킷) · 응답 캐시(stale-if-error) 통합 테스트. 실제 Redis 컨테이너를
// 띄우므로 기본 `test`에서 제외한다 — kafkaTest/timescaledbTest 와 동일한 이유.
tasks.register('redisTest', Test) {
    description = 'Runs KIS rate-limit / response-cache integration tests (requires Docker).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'redis'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
