databaseChangeLog:
  # Kafka 매매 주문 컨슈머(TradeOrderConsumer)의 멱등성 근거 컬럼.
  #
  # ai-agent 가 발행하는 trade.order.requested 메시지의 key = idempotencyKey
  # ("{userId}:{stockCode}:{tradeDate}:{side}", 예 "1:005930:2026-08-09:BUY") 를 그대로 저장한다.
  # 컨슈머는 KIS 주문 "전에" 이 키로 PENDING 행을 먼저 INSERT(claim)하고, UNIQUE 위반이면
  # 이미 다른 소비(또는 재전달된 같은 메시지)가 선점한 것이므로 KIS 를 호출하지 않는다.
  # => 중복 주문 방지의 최종 방어선은 애플리케이션 조회가 아니라 이 DB UNIQUE 제약이다.
  #
  # NULL 허용: 기존 행과 Kafka 를 거치지 않는 경로(web-app 수동 주문, /internal REST)는 키가 없다.
  # PostgreSQL 의 UNIQUE 는 NULL 을 중복으로 보지 않으므로 그런 행은 제약에 걸리지 않는다.
  - changeSet:
      id: 1.25.1-add-idempotency-key-to-trade-history
      author: claude
      context: mvp
      comment: "Add idempotency_key to trade_history for Kafka trade-order deduplication"
      changes:
        - addColumn:
            tableName: trade_history
            columns:
              - column:
                  name: idempotency_key
                  type: VARCHAR(120)
        - setColumnRemarks:
            tableName: trade_history
            columnName: idempotency_key
            remarks: 'Kafka 매매 주문 멱등키 ({userId}:{stockCode}:{tradeDate}:{side}). Kafka 경로가 아니면 NULL'

  - changeSet:
      id: 1.25.2-add-idempotency-key-unique-constraint
      author: claude
      context: mvp
      comment: "Enforce one trade_history row per Kafka idempotency key"
      changes:
        - addUniqueConstraint:
            tableName: trade_history
            columnNames: idempotency_key
            constraintName: uk_trade_history_idempotency_key
