databaseChangeLog:
  # 코인 멱등키를 사용자 단위로 좁힌다.
  #
  # v1.29 는 identifier 에 **단일 컬럼 UNIQUE** 를 걸었는데, idempotencyKey 는 클라이언트가 값을
  # 완전히 지정할 수 있는 문자열이라 그 제약이 사용자 경계를 넘는다. 결과가 두 가지였다:
  #
  #   1. 먼저 쓴 사람이 "1" 같은 값을 선점하면 다른 모든 사용자가 그 값을 영구히 쓸 수 없다.
  #   2. (더 나쁜 쪽) 조회도 전역이라 남의 키를 흉내내면 그 사람의 주문 내역이 통째로 응답되고,
  #      자기 주문은 "중복"으로 처리돼 업비트로 나가지 않으면서 화면에는 성공으로 보인다.
  #
  # 멱등은 **같은 사용자의 재시도**를 막기 위한 것이지 사용자 사이에 적용될 개념이 아니다.
  # 조회 쪽은 findByUserIdAndIdentifier 로 좁혔고, 여기서는 제약을 (user_id, identifier) 복합으로
  # 바꿔 DB 레벨 방어선도 같은 경계를 갖게 한다.
  #
  # 기존 행은 identifier 가 전역 유일했으므로 복합 UNIQUE 로 옮겨도 충돌하지 않는다.
  - changeSet:
      id: 1.30.1-scope-coin-identifier-to-user
      author: claude
      context: mvp
      comment: "Scope coin idempotency key uniqueness to (user_id, identifier) — the single-column UNIQUE crossed tenant boundaries"
      preConditions:
        # 제약이 이미 없는 환경(예: v1.29 이전으로 되돌린 DB)에서도 실패하지 않게 한다.
        - onFail: MARK_RAN
        - uniqueConstraintExists:
            tableName: coin_trade_history
            constraintName: uk_coin_trade_history_identifier
      changes:
        - dropUniqueConstraint:
            tableName: coin_trade_history
            constraintName: uk_coin_trade_history_identifier
        - addUniqueConstraint:
            tableName: coin_trade_history
            columnNames: user_id, identifier
            constraintName: uk_coin_trade_history_user_identifier
      rollback:
        - dropUniqueConstraint:
            tableName: coin_trade_history
            constraintName: uk_coin_trade_history_user_identifier
        - addUniqueConstraint:
            tableName: coin_trade_history
            columnNames: identifier
            constraintName: uk_coin_trade_history_identifier
