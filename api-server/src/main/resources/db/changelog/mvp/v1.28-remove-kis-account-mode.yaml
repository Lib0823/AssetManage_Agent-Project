databaseChangeLog:
  # 모의투자(KIS mock trading) 지원을 걷어내고 실전투자 전용으로 전환한다.
  #
  # 배경:
  #   v1.15 가 user_kis_accounts.account_mode(MOCK 기본)를 추가한 이래, 매매·잔고·체결통보의
  #   도메인과 TR_ID 가 유저별로 이 컬럼을 보고 갈렸다. 실전 전용으로 가면 고를 것이 없으므로
  #   컬럼 자체를 없앤다 — 분기를 반전시키는 게 아니라 분기를 지운다.
  #
  # 모의계좌 행을 남기지 않고 지우는 이유:
  #   모의계좌의 app_key/app_secret 은 모의 도메인에서만 유효하다. 컬럼만 드롭하고 행을 남기면
  #   그 자격증명이 실전 계좌로 승격돼 실전 도메인에 인증 실패로 계속 부딪힌다.
  #   유저가 실전 자격증명을 새로 등록하도록 행을 지운다.
  - changeSet:
      id: 1.28.1-delete-mock-kis-accounts
      author: claude
      context: mvp
      comment: "Delete KIS accounts registered against the mock domain; their credentials are not valid for real trading"
      changes:
        - delete:
            tableName: user_kis_accounts
            where: account_mode = 'MOCK'
      rollback:
        # 삭제된 행은 복구할 근거가 changelog 안에 없다(암호화된 자격증명 포함).
        # 되돌리려면 DB 백업에서 복원해야 한다. 여기서는 명시적 no-op.
        - empty

  - changeSet:
      id: 1.28.2-drop-account-mode-column
      author: claude
      context: mvp
      comment: "Drop user_kis_accounts.account_mode — all KIS routing is pinned to the real domain"
      changes:
        - dropColumn:
            tableName: user_kis_accounts
            columnName: account_mode
      rollback:
        - addColumn:
            tableName: user_kis_accounts
            columns:
              - column:
                  name: account_mode
                  type: VARCHAR(10)
                  defaultValue: MOCK
                  constraints:
                    nullable: false
