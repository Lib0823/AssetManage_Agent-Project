spring:
  application:
    name: api-server

  # 로컬 실행(IntelliJ/gradlew)에서 공용 시세·DART 키(.env)를 프로퍼티로 로드.
  # 작업 디렉터리가 api-server/ 든 프로젝트 루트든 잡히도록 두 경로 모두 시도(optional).
  # docker 등 파일이 없으면 무시되고 env_file 로 주입된다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:api-server/.env[.properties]

  # Jackson Configuration (LocalDate/LocalDateTime을 한국시간(KST) 기준으로 직렬화)
  jackson:
    time-zone: Asia/Seoul

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/financemanage
    username: admin
    password: admin1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # DB 연결 재시도 설정 (Compound 동시 실행 지원)
      initialization-fail-timeout: 60000  # 60초 동안 재시도
      connection-test-query: SELECT 1
      keepalive-time: 30000  # 30초마다 연결 유지 확인

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
    open-in-view: false

  # Kafka — ai-agent Stage 6 매매 주문 큐
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Redis — KIS 토큰 버킷(rate limit) + 시세/재무 응답 캐시.
  # Lettuce 는 지연 연결이라 Redis 가 떠 있지 않아도 기동은 성공하고, 실제 호출 시
  # 짧은 타임아웃으로 실패한 뒤 fail-open(rate limit 통과) · 캐시 미적용으로 degrade 한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 시세 조회 경로에 매달리지 않도록 짧게. Redis 장애가 KIS 조회 지연으로 번지면 안 된다.
      timeout: 1s
      connect-timeout: 1s

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false  # NEVER drop in production!
    contexts: mvp      # Start with MVP context

# Server Configuration
server:
  port: 7070
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT Configuration
# secret 기본값을 두지 않는다(빈 값): JWT_SECRET 미설정 시 JwtTokenProvider 가 기동을 중단시킨다.
# 저장소에 공개된 기본 키로 조용히 기동하면 누구나 토큰을 위조할 수 있다. 최소 32바이트(256bit).
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000    # 1 hour (ms)
  refresh-token-expiration: 86400000  # 24 hours (ms)

# Internal service-to-service API (ai-agent → api-server, /internal/**).
# X-Internal-Api-Key 헤더로 인증(InternalAuthFilter). 기본값을 두지 않는다(빈 값):
# INTERNAL_API_KEY 미설정 시 내부 채널은 fail-closed 로 전부 차단되어, 약한 기본 시크릿이
# 저장소에 노출되는 것을 방지한다. 운영/도커/로컬 모두 INTERNAL_API_KEY 를 주입해야 한다.
internal:
  api-key: ${INTERNAL_API_KEY:}

# Jasypt Configuration (Updated to secure algorithm)
# password 기본값을 두지 않는다(빈 값): JASYPT_PASSWORD 미설정 시 JasyptConfig 가 기동을 중단시킨다.
# 공개된 기본 키로 기동하면 user_kis_accounts 의 app_key/app_secret 을 누구나 복호화할 수 있다.
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    provider-name: SunJCE
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64

# KIS API Configuration
kis:
  # 매매/잔고/OAuth 도메인 — 실전투자 전용.
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}

  # Access Token 캐시 TTL
  # KIS API Access Token은 24시간 유효
  token-cache-ttl: 86400000  # 24 hours (ms)

  # 시세/재무 전용 자격증명. CompanyInfoService(기본정보/재무제표)만 사용한다.
  # 도메인은 base-url 과 같지만 자격증명이 다르다 — 매매는 사용자별 DB 키, 시세/재무는 서비스 공용 키.
  # quote-app-key/secret 둘 다 비어있으면 시세/재무 연동 비활성(필드 null + notice).
  quote-base-url: ${KIS_QUOTE_BASE_URL:https://openapi.koreainvestment.com:9443}
  quote-app-key: ${KIS_QUOTE_APP_KEY:}
  quote-app-secret: ${KIS_QUOTE_APP_SECRET:}

  # 장내채권 주문.
  bond:
    # 채권 주문 수량 단위(ORD_QTY2)가 액면금액인지 좌수인지 KIS 문서·예제에 명시가 없다.
    # 예상금액 = 수량 × 단가 ÷ face-value-divisor 이며, 이 값이 틀리면 사용자가 주문 확인
    # 화면에서 100배 틀린 금액을 보고 실전 주문을 낸다. 그래서 코드 상수가 아니라 설정으로 두어
    # 재배포 없이 정정할 수 있게 한다. 서버가 잔고 응답에 이 값을 실어 보내므로 프론트도 같은
    # 값을 쓴다(두 곳이 서로 다른 상수를 쓰는 사고 방지).
    #
    # 확정 방법(자금 이동 없음): 실계좌로 inquire-psbl-order(TTTC8910R)를 알려진 단가로 1회
    # 호출해 buy_psbl_amt ÷ buy_psbl_qty 비율을 보면 즉시 판별된다.
    face-value-divisor: ${KIS_BOND_FACE_VALUE_DIVISOR:100}

  # 외부 API(KIS) 의존성 격리 — Redis 기반 rate limit + 응답 캐시.
  # 둘 다 Redis 가 없거나 오류일 때 fail-open 으로 degrade 한다(Redis 장애가 KIS 조회를 막지 않음).
  resilience:
    rate-limit:
      enabled: ${KIS_RATE_LIMIT_ENABLED:true}
      # KIS 공식 제한 수치는 문서로 확정되지 않았다. ai-agent 가 이미 쓰는 관례
      # (asyncio.Semaphore(5) = 5 req/sec)와 맞춘 보수적 기본값이며, 실제 한도가 확인되면 조정한다.
      # capacity = 순간 버스트 허용량, refill-per-second = 초당 충전 토큰 수.
      # capacity 를 refill 의 2배로 두는 이유: 종목 상세 재무 탭이 한 번에 4연속 호출을 내는데,
      # 둘을 같게 두면 그 묶음이 버킷을 비워 다른 사용자의 첫 조회가 곧바로 거부된다.
      # 지속 호출률은 refill 이 결정하므로 KIS 에 대한 부하 상한은 그대로다.
      capacity: ${KIS_RATE_LIMIT_CAPACITY:10}
      refill-per-second: ${KIS_RATE_LIMIT_REFILL:5}
    cache:
      enabled: ${KIS_CACHE_ENABLED:true}
      # 시세(FHKST01010100 현재가 / FHKST01010200 호가): 신선도 30초.
      quote-ttl: 30s
      # 재무(FHKST664302/3/600 손익·재무비율·안정성비율): 분기마다 바뀌는 값이라 24시간.
      finance-ttl: 24h
      # stale-if-error 보관 기간(신선도와 별개). KIS 장애 시 이 기간 안의 마지막 성공값을
      # "최신 아님" 안내와 함께 돌려준다. 신선 TTL 보다 반드시 길어야 의미가 있다.
      quote-stale-grace: 24h
      finance-stale-grace: 7d

  # 실시간 시세 WebSocket 브리지 (Phase 1: 호가 + 체결가).
  # - enabled=false(기본): 상향 연결/엔드포인트 미등록 → 브라우저는 REST 스냅샷 유지(graceful degrade).
  # - ws-url: 실전 ws://ops.koreainvestment.com:21000.
  # - max-symbols: 상향 연결당 구독 상한(MUST-VERIFY ~41). refcount 로 심볼당 1회 등록.
  # - frame-debug: true 면 TR별 첫 데이터 프레임의 index→value 를 1회 로깅(필드 인덱스 MUST-VERIFY 확정용).
  realtime:
    enabled: ${KIS_REALTIME_ENABLED:false}
    ws-url: ${KIS_REALTIME_WS_URL:ws://ops.koreainvestment.com:21000}
    max-symbols: ${KIS_REALTIME_MAX_SYMBOLS:40}
    frame-debug: ${KIS_REALTIME_FRAME_DEBUG:false}

    # 실시간 체결통보(fill notification) — Phase 2 (KR 전용, 사용자 계좌키 + AES 암호 프레임).
    # - enabled=false(기본): 레지스트리/팩토리 빈 미생성 → 핸들러는 fills 요청에 disabled 안내(graceful degrade). Phase 1 무영향.
    # - ws-url: 실전 ws://ops.koreainvestment.com:21000 (시세와 같은 실전 도메인).
    # - tr_key = 사용자 HTS ID(user_kis_accounts.hts_id), tr_id = H0STCNI0(국내) / H0GSCNI0(해외).
    # - approval/계정키 = 사용자 appkey/secret + kis.base-url. AES key/iv = 구독 ACK output.{key,iv}.
    # - frame-debug: true 면 첫 복호 체결 프레임의 index→value 를 1회 로깅(필드 인덱스/CNTG_YN/SELN_BYOV_CLS MUST-VERIFY 확정용; 계좌/주문정보 포함 → 운영 false).
    fills:
      enabled: ${KIS_REALTIME_FILLS_ENABLED:false}
      ws-url: ${KIS_REALTIME_FILLS_WS_URL:ws://ops.koreainvestment.com:21000}
      frame-debug: ${KIS_REALTIME_FILLS_FRAME_DEBUG:false}

# DART (금융감독원 전자공시) Open API Configuration
dart:
  # 발급키: https://opendart.fss.or.kr (없으면 DART 연동 비활성, DART 필드는 null)
  api-key: ${DART_API_KEY:}
  base-url: https://opendart.fss.or.kr/api

# WebAuthn / Passkey (생체 로그인) Configuration
# - rp-id : 자격증명이 유효한 도메인. 프론트 origin 의 등록 가능한 부모 도메인이어야 함(로컬=localhost).
# - rp-name : 인증기 UI 에 표시되는 서비스 이름.
# - origins : 프론트 실행 origin 목록(콤마 구분). rp-id 와 정확히 일치해야 NotAllowedError 가 안 남.
# 운영은 HTTPS 도메인으로 교체(WEBAUTHN_RP_ID / WEBAUTHN_ORIGINS).
webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:FinanceManage}
  origins: ${WEBAUTHN_ORIGINS:http://localhost:5173}

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:5173  # Vue3 dev server (default)
    - http://localhost:5174  # Vue3 dev server (alternative port)
    - http://localhost:3000  # Nginx production
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true
  max-age: 3600

# Logging Configuration
logging:
  level:
    root: INFO
    com.inbeom.apiserver: INFO
    # org.springframework.web 는 INFO 유지: DEBUG 면 RestTemplate 요청 본문(KIS appkey/appsecret)이
    # 평문으로 로그에 남는 보안 문제가 있다. 디버깅 시에만 일시적으로 올릴 것.
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration (Health Check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
